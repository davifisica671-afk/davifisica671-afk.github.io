<!DOCTYPE html><html lang="en"><head><script>/*NEXTIMG-PATCH*/(function(){function fixUrl(u){if(typeof u!=='string'||u.indexOf('/_next/image')===-1)return u;try{var i=u.indexOf('?');if(i<0)return u;var q=new URLSearchParams(u.substring(i+1));var o=q.get('url');if(!o)return u;var d=decodeURIComponent(o);return d.charAt(0)==='/'?d:u}catch(e){return u}}function fixSrcset(s){if(typeof s!=='string'||s.indexOf('/_next/image')===-1)return s;return s.split(',').map(function(part){var t=part.trim();if(!t)return t;var sp=t.split(/\s+/);var f=fixUrl(sp[0]);return f===sp[0]?t:(f+(sp.length>1?' '+sp.slice(1).join(' '):''))}).join(', ')}function patch(el,attr){var v=el.getAttribute(attr);if(!v)return;var f=attr==='srcset'||attr==='imageSrcSet'?fixSrcset(v):fixUrl(v);if(f!==v)el.setAttribute(attr,f)}function scan(root){var els=(root||document).querySelectorAll('img[src],img[srcset],source[srcset],link[imageSrc],link[imageSrcSet]');for(var i=0;i<els.length;i++){var el=els[i];if(el.hasAttribute('src'))patch(el,'src');if(el.hasAttribute('srcset'))patch(el,'srcset');if(el.hasAttribute('imageSrc'))patch(el,'imageSrc');if(el.hasAttribute('imageSrcSet'))patch(el,'imageSrcSet')}}scan();document.addEventListener('DOMContentLoaded',function(){scan()});new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var m=ms[i];if(m.type==='attributes'){patch(m.target,m.attributeName)}else if(m.type==='childList'&&m.addedNodes.length){for(var j=0;j<m.addedNodes.length;j++){var n=m.addedNodes[j];if(n.nodeType===1){scan(n)}}}}}).observe(document.documentElement,{attributes:true,childList:true,subtree:true,attributeFilter:['src','srcset','imageSrc','imageSrcSet']})})();</script><meta charset="utf-8">
